appId: com.pomotime.app
productName: POMOTIME!
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.editorconfig,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
mac:
  target: dmg
  category: public.app-category.productivity
  notarize: false
dmg:
  artifactName: POMOTIME-${version}-${arch}.${ext}
win:
  target: nsis
  executableName: POMOTIME
nsis:
  artifactName: POMOTIME-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
linux:
  target: AppImage
  category: Utility
appImage:
  artifactName: POMOTIME-${version}.${ext}
npmRebuild: false
